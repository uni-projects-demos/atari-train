name: verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Setup ALE
        run: bash crates/ale-bridge/native/setup.sh

      - name: Build
        run: cargo build --locked --workspace

      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
