[package]
name = "atari-train"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
description = "Deep-RL train, eval and export Atari policies for multiple games using ALE and Burn with DQN, IQN, PPO or Rainbow."
license = "GPL-2.0-only"

[workspace]
members = ["crates/ale-bridge"]
resolver = "2"

[features]
default = ["native"]
native = ["dep:ale-bridge"]
gpu = ["burn/cuda", "burn/fusion", "burn/autotune"]

[dependencies]
anyhow = "1.0.104"
ale-bridge = { path = "crates/ale-bridge", optional = true }
burn = { version = "=0.22.1", default-features = false, features = ["std", "optim", "flex", "simd", "rayon"] }
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
safetensors = "0.8.0"
prost = "0.14.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = false
codegen-units = 16
